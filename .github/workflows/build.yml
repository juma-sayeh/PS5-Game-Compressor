name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      # Builds against the latest ps5-payload-sdk release by default,
      # resolved to a real tag at build time (see _build.yml). Set a
      # PS5_SDK_VERSION repository variable (Settings > Secrets and
      # variables > Actions > Variables) if you ever want to pin to a
      # specific tag instead, across all three workflows from one place.
      sdk_version: ${{ vars.PS5_SDK_VERSION || 'latest' }}
