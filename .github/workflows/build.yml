name: Build PS5 ELF

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ps5-payload-sdk
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -o -q -d /opt ps5-payload-sdk.zip

      - name: Build zlib for PS5
        run: |
          set -e
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -O2 -c adler32.c compress.c crc32.c deflate.c infback.c inffast.c inflate.c inftrees.c trees.c uncompr.c zutil.c
          mkdir -p ../zlib-ps5
          "$PS5_PAYLOAD_SDK/bin/llvm-ar" rcs ../zlib-ps5/libz.a *.o
          cp zlib.h zconf.h ../zlib-ps5/

      - name: Build game-compressor.elf
        run: make
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          ZLIB_INCLUDE: ${{ github.workspace }}/zlib-ps5
          ZLIB_LIB: ${{ github.workspace }}/zlib-ps5/libz.a

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-compressor.elf
          path: game-compressor.elf
          if-no-files-found: error
